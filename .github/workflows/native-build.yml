name: Native builds

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: '**/*.gradle.kts'
      - name: SDK and wrapper
        run: |
          chmod +x gradlew
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0'
      - name: Shared tests, Android lint, and debug build
        run: ./gradlew :shared:jvmTest :androidApp:lintDebug :androidApp:assembleDebug :androidApp:assembleDebugAndroidTest --stacktrace
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android device tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            adb shell svc wifi disable
            adb shell svc data disable
            ./gradlew :androidApp:connectedDebugAndroidTest --stacktrace
            adb pull /sdcard/Pictures/VanguardEnergyTests androidApp/build/screenshots
      - name: Android artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: android-development
          path: |
            androidApp/build/outputs/apk/debug/*.apk
            androidApp/build/reports/
            androidApp/build/screenshots/
            shared/build/reports/tests/jvmTest/

  ios:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: '**/*.gradle.kts'
      - name: Cache Kotlin native toolchain
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.konan
          key: ${{ runner.os }}-${{ runner.arch }}-kotlin-native-2.3.21-xcode-16.4
      - name: Generate Xcode project
        run: |
          chmod +x gradlew
          if ! command -v xcodegen >/dev/null; then brew install xcodegen; fi
          xcodegen generate --spec iosApp/project.yml
      - name: Build iOS simulator app
        run: |
          xcodebuild -project iosApp/VanguardEnergy.xcodeproj -scheme VanguardEnergy -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath iosApp/build/DerivedData ARCHS=arm64 CODE_SIGNING_ALLOWED=NO build
      - name: Build unsigned iOS device archive
        run: |
          xcodebuild -project iosApp/VanguardEnergy.xcodeproj -scheme VanguardEnergy -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -archivePath iosApp/build/VanguardEnergy.xcarchive CODE_SIGNING_ALLOWED=NO archive
      - name: Check privacy declarations in the archived app
        run: |
          python3 - <<'PY'
          import pathlib, plistlib, subprocess
          app = pathlib.Path('iosApp/build/VanguardEnergy.xcarchive/Products/Applications/VanguardEnergy.app')
          manifest = plistlib.loads((app / 'PrivacyInfo.xcprivacy').read_bytes())
          reasons = {entry['NSPrivacyAccessedAPIType']: entry['NSPrivacyAccessedAPITypeReasons']
                     for entry in manifest['NSPrivacyAccessedAPITypes']}
          imports = {line.split()[-1] for line in subprocess.check_output(
              ['xcrun', 'nm', '-u', str(app / 'VanguardEnergy')], text=True).splitlines() if line.split()}
          categories = {
              'FileTimestamp': {'_stat', '_fstat', '_fstatat', '_lstat'},
              'SystemBootTime': {'_mach_absolute_time'},
              'DiskSpace': {'_statfs', '_fstatfs', '_statvfs', '_fstatvfs'},
              'UserDefaults': {'_OBJC_CLASS_$_NSUserDefaults'},
          }
          for category, symbols in categories.items():
              if imports & symbols:
                  key = 'NSPrivacyAccessedAPICategory' + category
                  assert reasons.get(key), f'Missing privacy reason for {category}: {imports & symbols}'
          assert reasons.get('NSPrivacyAccessedAPICategoryFileTimestamp') == ['C617.1']
          assert reasons.get('NSPrivacyAccessedAPICategoryUserDefaults') == ['CA92.1']
          print('Archived privacy manifest covers the linked required-reason APIs.')
          PY
      - name: Smoke test iOS launch
        run: |
          ./gradlew --stop
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for key,items in d["devices"].items() if "iOS-18-5" in key for x in items if x["name"] == "iPhone 16"))')
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl install "$DEVICE" iosApp/build/DerivedData/Build/Products/Debug-iphonesimulator/VanguardEnergy.app
          xcrun simctl launch "$DEVICE" app.vanguard.energy
          sleep 5
          xcrun simctl io "$DEVICE" screenshot iosApp/build/ios-simulator.png
          xcrun simctl spawn "$DEVICE" launchctl list | awk '$1 ~ /^[0-9]+$/ && /app.vanguard.energy/ { found=1 } END { exit !found }'
      - name: Package iOS outputs
        run: |
          ditto -c -k --keepParent iosApp/build/DerivedData/Build/Products/Debug-iphonesimulator/VanguardEnergy.app iosApp/build/ios-simulator.zip
          ditto -c -k --keepParent iosApp/build/VanguardEnergy.xcarchive iosApp/build/ios-device-unsigned.zip
          ditto -c -k --keepParent iosApp/VanguardEnergy.xcodeproj iosApp/build/xcode-project.zip
          cd iosApp/build
          shasum -a 256 ios-simulator.zip ios-device-unsigned.zip > ios.sha256
      - name: iOS artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ios-unsigned
          path: |
            iosApp/build/ios-simulator.zip
            iosApp/build/ios-device-unsigned.zip
            iosApp/build/xcode-project.zip
            iosApp/build/ios.sha256
            iosApp/build/ios-simulator.png
